<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memos</title>
<style>
:root{--ink:#0b0b0b;--ink2:#52514e;--line:#e6e5e1;--blue:#2a78d6;--bg:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#f0efec;--ink2:#c3c2b7;--line:#2c2c2a;--blue:#3987e5;--bg:#121211}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:48px 20px}
h1{font-size:28px;letter-spacing:-.01em;margin:0 0 4px}.sub{color:var(--ink2);margin:0 0 28px}
.item{padding:16px 0;border-bottom:1px solid var(--line)}.item a{font-size:19px;font-weight:650;color:var(--ink);text-decoration:none}
.item a:hover{color:var(--blue)}.item .d{color:var(--ink2);font-size:14.5px;margin-top:4px}.item .m{font-size:12px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
</style></head><body><div class="wrap">
<h1>Memos</h1><p class="sub">Fritz Lanman</p>
<div class="item"><div class="m">November 8, 2026</div><a href="ai-energy/">Overbuild, Collapse, Win Anyway</a><div class="d">What the railroads, the dynamo and dark fiber say about AI, energy and the price of intelligence. Eight pages, thirteen charts.</div></div>
</div></body></html>
